[project]
name = "coursework-project-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Den Sol",email = "densfmost@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.0.0,<3.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "requests (>=2.33.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E501"]